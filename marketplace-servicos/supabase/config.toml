# Supabase local development config
# Para usar localmente: supabase start

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "5MiB"

[auth]
site_url = "exp://localhost:8081"
additional_redirect_urls = ["marketplace://auth/callback", "http://localhost:3001"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
